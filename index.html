<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว | ชณัฐพล พรพนาธาร</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --primary-color: #6C5CE7; /* สีม่วงหลัก */
            --secondary-color: #A29BFE; /* สีม่วงอ่อน */
            --dark-color: #2D3436;
            --light-color: #F9F9F9;
            --bg-gradient: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* การ์ดโปรไฟล์หลัก */
        .profile-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.15);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* ส่วนหัวสีม่วง */
        .profile-header {
            background: var(--bg-gradient);
            padding: 40px 20px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }
